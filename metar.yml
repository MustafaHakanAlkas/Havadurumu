name: metar-tr
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Önceki dosyayı al (72 saatlik birikim için)
        run: mkdir -p out && (curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/metar-data/metar-tr.json" -o out/metar-tr.json || true)
      - name: METAR çek ve birleştir
        run: python3 scripts/metar.py
      - name: metar-data dalına yayınla (geçmiş birikmez)
        run: |
          cd out
          git init -q -b metar-data
          git config user.name github-actions
          git config user.email actions@github.com
          git add metar-tr.json
          git commit -q -m "metar $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" metar-data
